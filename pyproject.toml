[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "autoresearch-swarm"
version = "0.1.0.dev0"
description = "A local-first, agent-controlled engine for reproducible parallel research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Vincent Koc"}]
dependencies = [
  "cryptography>=50.0.2,<51",
  "fastapi>=0.115,<1",
  "filelock>=4.2.1,<5",
  "httpx>=0.28,<1",
  "mcp>=2.3,<3",
  "psutil>=6,<8",
  "pydantic>=2.12,<3",
  "rfc8785>=0.1.4,<1",
  "uvicorn>=0.47,<1",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.35,<2"]
mlx = ["mlx>=0.30"]
torch = ["torch>=2.6"]
s3 = ["boto3>=1.35,<2"]

[dependency-groups]
release = ["build==1.6.1", "hatchling==1.33.0", "twine==7.0.0"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "hypothesis>=6.130,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<3",
  "types-psutil>=7.2.2.20260906",
  "temporalio>=1.35,<2",
]

[project.urls]
Repository = "https://github.com/vincentkoc/autoresearch-swarm"
Documentation = "https://github.com/vincentkoc/autoresearch-swarm/tree/main/docs"

[project.scripts]
research = "research_swarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_swarm"]

[tool.hatch.build.targets.sdist]
include = ["/src/research_swarm", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
