name: Witness runtime qualification

on:
  workflow_dispatch:
    inputs:
      surface:
        description: Qualification surface
        type: choice
        default: all
        options: [all, native, windows, workerd]

permissions:
  contents: read

concurrency:
  group: witness-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: inputs.surface != 'workerd'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.surface == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RESEARCH_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: uv sync --locked --group dev --python 3.12
      - run: >-
          uv run --no-sync pytest -q --tb=short
          tests/test_time_witnesses.py tests/test_native_time_witnesses.py
          tests/test_time_witness_http.py tests/test_time_providers.py
          tests/test_witness_launcher.py
          tests/test_witness_time.py tests/test_command_boundaries.py tests/test_query_boundaries.py
          tests/test_worker_query_boundaries.py
          tests/test_cloudflare_exclusive.py tests/test_cli_fixture_io.py
          tests/test_existing_state.py tests/test_hosted_router.py tests/test_hosted_artifacts.py
          tests/test_hosted_http.py tests/test_http_binding.py tests/test_witness_binding.py
          tests/test_clock_admission.py tests/test_source_bytes.py tests/test_hosted_research.py
          tests/test_hosted_worker_inputs.py
          tests/test_hosted_worker_outputs.py
          tests/test_hosted_result_publication.py tests/test_observation_bytes.py
          tests/test_evaluation_preparation.py
          tests/test_hosted_evaluations.py
          tests/test_hosted_lifecycle.py
          tests/test_hosted_scientific.py
          tests/test_hosted_orchestration.py tests/test_turn_preparation.py
          tests/test_delivery_registration.py
          tests/test_async_delivery.py
          tests/test_async_successor.py
          tests/test_hosted_delivery.py
          tests/test_transfer_preparation.py tests/test_orchestration_transfer.py
          tests/test_transfer_limits.py
          tests/test_snapshot_limits.py tests/test_event_recovery.py
          tests/test_snapshot_time.py
          tests/test_hosted_transfers.py
          tests/test_hosted_transfer_evidence.py
          tests/test_hosted_startup.py
          tests/test_cloudflare_deployment.py
          tests/test_credential_installation.py
          tests/test_cloudflare_provisioning.py
          tests/test_checkpoint_images.py tests/test_checkpoint_cut.py tests/test_checkpoint_schema.py
          tests/test_inactive_transform.py
          tests/test_cloudflare_runtime.py
          tests/test_production_delivery.py
          tests/test_cloudflare_store_open.py
          tests/test_cloudflare_build.py
          tests/test_cli_encoding.py tests/test_agent_research_cycle.py
          tests/test_supervision.py
          tests/test_scoped_driver.py::test_independent_worker_process_restart_recovers_the_original_running_native_scope
  workerd:
    if: inputs.surface == 'all' || inputs.surface == 'workerd'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      RESEARCH_CLOUDFLARE_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: uv sync --locked --group dev --python 3.12
      - run: node --test adapters/cloudflare/http_io.test.mjs adapters/cloudflare/witness_io.test.mjs
      - run: uv sync --directory adapters/cloudflare --locked --python 3.12
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: adapters/cloudflare
      - run: npm run build
        working-directory: adapters/cloudflare
      - run: npm run build:production
        working-directory: adapters/cloudflare
      - run: npm run check:hybrid && npm run test:hybrid
        working-directory: adapters/cloudflare
      - run: .venv/bin/uv run --frozen pywrangler sync
        working-directory: adapters/cloudflare
      - run: git diff --exit-code -- adapters/cloudflare/pylock.toml
      - run: >-
          uv run --no-sync pytest -q tests/test_cloudflare_native.py
          tests/test_cloudflare_witness_ordering.py tests/test_cloudflare_router.py
          tests/test_cloudflare_async_r2.py tests/test_cloudflare_artifacts.py
          tests/test_cloudflare_result_publication.py
          tests/test_cloudflare_evaluations.py
          tests/test_cloudflare_orchestration.py
          tests/test_cloudflare_hosted_workflow.py
          tests/test_cloudflare_transfers.py
          tests/test_cloudflare_startup.py
          tests/test_cloudflare_production.py
          tests/test_cloudflare_hosted_http.py tests/test_cloudflare_native_source.py
          tests/test_cloudflare_research_admission.py --tb=short
