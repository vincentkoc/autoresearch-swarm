name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.19"
      - name: Require source CI for the exact release commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success"
          --jq '.workflow_runs | any(.event == "push" and .head_branch == "main")' | grep -qx true
      - run: uv sync --locked --group dev --group release --python 3.12
      - name: Check source identity
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          uv run --no-sync python -c 'import os; from pathlib import Path; from scripts.release import source_identity; p=source_identity(Path.cwd(), os.environ["RELEASE_TAG"] or None); print("version="+p["version"])' >> "$GITHUB_OUTPUT"
      - run: uv run --no-sync pytest -q tests/integration/test_release_artifacts.py
      - name: Build sdist and wheel from that sdist
        run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: uv run --no-sync python scripts/release.py dist --write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  installed-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RESEARCH_PACKAGE_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.19"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-${{ github.sha }}
          path: dist
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: uv run --no-sync python scripts/release.py dist --github-env
      - name: Install and exercise the exact downloaded wheel
        run: uv run --no-sync pytest -q tests/integration/test_packaged_release.py

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, installed-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/autoresearch-swarm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-${{ github.sha }}
          path: release
      - name: Verify and stage the qualified distributions
        working-directory: release
        run: |
          sha256sum --check --strict SHA256SUMS
          mkdir ../dist
          cp -- *.whl *.tar.gz ../dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-${{ github.sha }}
          path: release
      - name: Publish the same release assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check --strict SHA256SUMS
          prerelease=()
          if [[ "$RELEASE_VERSION" =~ (a|b|rc)[0-9]+ ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" --title "$RELEASE_TAG" --notes "Release notes: https://github.com/$GH_REPO/blob/$GITHUB_SHA/CHANGELOG.md"
          gh release upload "$RELEASE_TAG" -- *.whl *.tar.gz manifest.json SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
