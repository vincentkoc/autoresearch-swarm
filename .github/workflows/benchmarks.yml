name: Research benchmarks

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "tests/benchmarks/**"
      - "src/research_swarm/swarm/panels.py"
      - ".github/workflows/benchmarks.yml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "tests/benchmarks/**"
      - "src/research_swarm/swarm/panels.py"
      - ".github/workflows/benchmarks.yml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: research-benchmarks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  small:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --group dev --extra torch --python 3.12
      - run: uv run --no-sync python -c "import torch"
      - run: uv run --no-sync pytest -q tests/benchmarks
