name: Research benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --group dev --extra torch --python 3.12
      - run: uv run --no-sync python -c "import torch"
      - run: uv run --no-sync pytest -q tests/benchmarks
